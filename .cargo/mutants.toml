# Configuration for cargo-mutants
# https://mutants.rs/config.html

# Allow transcendental math loops to finish while capping infinite loops.
minimum_test_timeout = 5
timeout_multiplier = 2.0

test_tool = "cargo"

# Many evaluator and parser mutants are only observable end to end, through the GNU
# differential tests and the POSIX suite in bc_clone, so every mutant runs the whole workspace.
test_workspace = true

# Proof-only files compiled only under `cargo kani` or `verus`.
exclude_globs = [
    "crates/bc_core/src/kani_proofs.rs",
    "crates/bc_core/src/verus_proofs.rs",
]

# Only mutants that are semantically equivalent or untestable on the host. Keep each pattern
# as narrow as possible and give the reason.
exclude_re = [
    # bc_exp: `int_approx / 2` and `x.scale / ...` only size the extra guard digits; `*` adds more
    # guard digits, which cannot change a result truncated to `scale`.
    "replace / with \\* in bc_exp",
    # The default `BcWriter::flush` and test writers' flush are no-ops by design.
    "flush.* -> core::fmt::Result with Ok\\(Default::default\\(\\)\\)",
    # Heap initialization runs only on no_std embedded targets, never in host tests.
    "init_heap_if_needed",
    # Cursor-advance mutants never move past the current character, so every test that lexes
    # input hangs; cargo-mutants would report timeouts rather than misses.
    "in Lexer::advance_char",
    "replace Lexer::advance_char with \\(\\)",
]
