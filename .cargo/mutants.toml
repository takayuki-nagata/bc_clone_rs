# Configuration for cargo-mutants
# https://mutants.rs/config.html

# Allow transcendental math loops to finish while capping infinite loops.
minimum_test_timeout = 5
timeout_multiplier = 2.0

test_tool = "cargo"

# Many evaluator and parser mutants are only observable end to end, through the GNU
# differential tests and the POSIX suite in bc_clone, so every mutant runs the whole workspace.
test_workspace = true

# Proof-only files compiled only under `cargo kani`.
exclude_globs = [
    "crates/bc_core/src/kani_proofs.rs",
    # Property tests compiled only under `cfg(test)` (declared in `math.rs`, so cargo-mutants
    # does not see the attribute): their helpers are the reference, not the code under test.
    "crates/bc_core/src/math/proptests.rs",
    # Likewise the tests of the trusted `num-bigint` wrappers against the specification
    # (declared in `trusted_bigint.rs`).
    "crates/bc_core/src/trusted_bigint/oracle_tests.rs",
    # The executable specification is the oracle, not the code under test: it is proved equal to
    # its `spec fn`s by Verus, and `cargo test` does not run it (spec_differential needs
    # BC_SPEC_ORACLE), so every mutant would be reported as missed.
    "crates/bc_spec/**",
    # The verification inventory is a tool, not code under test, like the specification: its
    # decisions are inside `verus!` (which cargo-mutants does not mutate) and proved equal to its
    # rules, and its reader and writer are checked by their own fixture tests; running the whole
    # workspace for each mutant of the reader would take hours.
    "crates/bc_inventory/**",
    # The bare-metal binary of the QEMU runner is built for riscv32 only, so no host test
    # compiles it (every mutant would be missed); its functions are branch-free shims run by
    # scripts/run_qemu_riscv32_tests.sh, and its decisions are in the library, which is mutated.
    "crates/bc_qemu_riscv32/src/main.rs",
    "crates/bc_qemu_riscv32/src/uart.rs",
    "crates/bc_qemu_riscv32/src/qemu_exit.rs",
]

# Only mutants that are semantically equivalent or untestable on the host. Keep each pattern
# as narrow as possible and give the reason.
exclude_re = [
    # The default `BcWriter::flush` and test writers' flush are no-ops by design.
    "flush.* -> core::fmt::Result with Ok\\(Default::default\\(\\)\\)",
    # Heap initialization runs only on no_std embedded targets, never in host tests.
    "init_heap_if_needed",
    # The report to QEMU's test device: the no_std body is not compiled in host tests (its
    # value is the Kani- and Verus-checked kernel), and the std body is already empty.
    "replace report_to_test_device with \\(\\)",
    # The stack painting of the measurement reads the stack pointer with riscv32 assembly, so it
    # is not compiled on the host; it is a branch-free shim over the Miri-tested `for_each_word`.
    "replace paint_stack with \\(\\)",
    " in paint_stack$",
    "replace current_sp -> usize with ",
    # Cursor-advance mutants never move past the current character, so every test that lexes
    # input hangs; cargo-mutants would report timeouts rather than misses.
    "in Lexer::advance_char",
    "replace Lexer::advance_char with \\(\\)",

    # Code that tests cannot observe:
    # - Kani harnesses (`#[cfg(kani)] mod kani_proofs`) only compile under `cargo kani`.
    "kani_proofs::",
    # - `main` and the process-wide panic hook (the hook only changes what a default panic
    #   message looks like; unit panics are reported by `run_unit_guarded`, which is tested).
    " in main$",
    "install_panic_hook",
    # - Boundary at exactly BC_SCALE_MAX: exercising it needs a constant with 10^9 fraction
    #   digits.
    "replace > with (==|>=) in BCNum::try_from_string",

    # - The operands of a relational expression were parsed one level deeper and checked with
    #   `depth + 1 + height <= max_depth`, so the relational check `1 + max(l, r)` never fails
    #   and `1 * max(l, r)` agrees with it.
    "replace \\+ with \\* in Parser::parse_relational_expression",

    # Code inside `verus!` (the verified BCNum operations, formatting, evaluator and driver) is
    # not mutated: cargo-mutants does not look inside macros. Its proofs cover it instead.
]
