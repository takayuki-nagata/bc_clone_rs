name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build, Lint, Test, and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: riscv32imac-unknown-none-elf, riscv32imc-unknown-none-elf, wasm32-unknown-unknown

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: |
          cargo clippy --package bc_core --package bc_clone --package bc_c_api --package bc_zephyr --all-targets -- -D warnings
          cargo clippy --package bc_qemu_riscv32 --target riscv32imac-unknown-none-elf -- -D warnings
          cargo clippy --package bc_qemu_riscv32 --target riscv32imc-unknown-none-elf -- -D warnings
          cargo clippy --package bc_c_api --target riscv32imac-unknown-none-elf --no-default-features -- -D warnings
          cargo clippy --package bc_c_api --target riscv32imc-unknown-none-elf --no-default-features -- -D warnings
          cargo clippy --package bc_zephyr --target riscv32imac-unknown-none-elf --no-default-features -- -D warnings
          cargo clippy --package bc_zephyr --target riscv32imc-unknown-none-elf --no-default-features -- -D warnings

      - name: Verify no_std Compilation on RISC-V 32 and Wasm32
        run: |
          cargo check --package bc_core --target riscv32imac-unknown-none-elf --no-default-features
          cargo check --package bc_core --target riscv32imc-unknown-none-elf --no-default-features
          cargo check --package bc_core --target wasm32-unknown-unknown --no-default-features
          cargo check --package bc_c_api --target riscv32imac-unknown-none-elf --no-default-features
          cargo check --package bc_c_api --target riscv32imc-unknown-none-elf --no-default-features
          cargo check --package bc_zephyr --target riscv32imac-unknown-none-elf --no-default-features
          cargo check --package bc_zephyr --target riscv32imc-unknown-none-elf --no-default-features

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Tests with Coverage
        run: cargo llvm-cov --package bc_core --package bc_clone --package bc_c_api --package bc_zephyr --all-targets --fail-under-lines 98 --lcov --output-path lcov.info

      - name: Run Official GNU bc Reference Test Suite
        run: bash scripts/run_gnu_reference_tests.sh

      - name: Run POSIX IEEE Std 1003.1 Compliance Test Suite
        run: bash scripts/run_posix_compliance_tests.sh

      - name: Verify M5Stamp C3 (ESP32-C3) Baremetal Application
        run: bash scripts/build_m5stamp_c3.sh

      - name: Verify WebAssembly (wasm32) Web Application
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 || true
          bash scripts/build_wasm.sh

      - name: Install QEMU RISC-V System Emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-misc

      - name: Run QEMU RISC-V 32 Baremetal Automated Test Suite
        run: bash scripts/run_qemu_riscv32_tests.sh

      - name: Install Verus Formal Verifier
        run: |
          VERUS_VERSION="0.2026.10.18.7d82994"
          VERUS_URL="https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          if [ ! -x "$HOME/.local/verus/verus" ]; then
            TMP_DIR="$(mktemp -d)"
            curl -fL "$VERUS_URL" -o "$TMP_DIR/verus.zip"
            unzip -q "$TMP_DIR/verus.zip" -d "$TMP_DIR/extracted"
            mkdir -p "$HOME/.local/verus"
            if [ -d "$TMP_DIR/extracted/verus-x86-linux" ]; then
              cp -a "$TMP_DIR/extracted/verus-x86-linux/." "$HOME/.local/verus/"
            else
              cp -a "$TMP_DIR/extracted/." "$HOME/.local/verus/"
            fi
            chmod +x "$HOME/.local/verus/verus" "$HOME/.local/verus/rust_verify" "$HOME/.local/verus/z3" "$HOME/.local/verus/cargo-verus" 2>/dev/null || true
            rm -rf "$TMP_DIR"
          fi
          REQUIRED_TOOLCHAIN="$(sed -n 's/.*"toolchain": "\([^" ]*\).*/\1/p' "$HOME/.local/verus/version.json" | head -n 1)"
          if [ -n "$REQUIRED_TOOLCHAIN" ] && ! rustup toolchain list | grep -q "^${REQUIRED_TOOLCHAIN}"; then
            rustup toolchain install "$REQUIRED_TOOLCHAIN" --profile minimal --no-self-update
          fi

      - name: Run Verus Formal Verification (bc_core)
        run: bash scripts/run_verus_verification.sh

      - name: Run Kani Bounded Model Checking Verification
        run: bash scripts/run_kani_verification.sh

      - name: Run Miri Undefined Behavior & Memory-Safety Verification
        run: bash scripts/run_miri_tests.sh


      - name: Install cargo-audit

        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo-audit
        run: cargo audit

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      - name: Fetch base branch for diff (Pull Request)
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Run Diff-based Mutation Testing (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          cargo mutants --in-diff pr.diff

      - name: Run Diff-based Mutation Testing (Push)
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          IF_NULL="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$IF_NULL" ] || [ -z "$BEFORE" ]; then
            git diff HEAD~1..HEAD > push.diff
          else
            git diff $BEFORE..HEAD > push.diff
          fi
          cargo mutants --in-diff push.diff




