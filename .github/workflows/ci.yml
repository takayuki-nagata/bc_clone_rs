name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build, Lint, Test, and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: riscv32imac-unknown-none-elf, riscv32imc-unknown-none-elf, wasm32-unknown-unknown

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: |
          cargo clippy --package bc_core --package bc_clone --all-targets -- -D warnings
          cargo clippy --package bc_qemu_riscv32 --target riscv32imac-unknown-none-elf -- -D warnings
          cargo clippy --package bc_qemu_riscv32 --target riscv32imc-unknown-none-elf -- -D warnings

      - name: Verify no_std Compilation on RISC-V 32 and Wasm32
        run: |
          cargo check --package bc_core --target riscv32imac-unknown-none-elf --no-default-features
          cargo check --package bc_core --target riscv32imc-unknown-none-elf --no-default-features
          cargo check --package bc_core --target wasm32-unknown-unknown --no-default-features

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Tests with Coverage
        run: cargo llvm-cov --package bc_core --package bc_clone --all-targets --fail-under-lines 98 --lcov --output-path lcov.info

      - name: Run Official GNU bc Reference Test Suite
        run: bash scripts/run_gnu_reference_tests.sh

      - name: Run POSIX IEEE Std 1003.1 Compliance Test Suite
        run: bash scripts/run_posix_compliance_tests.sh

      - name: Install QEMU RISC-V System Emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-misc

      - name: Run QEMU RISC-V 32 Baremetal Automated Test Suite
        run: bash scripts/run_qemu_riscv32_tests.sh


      - name: Install cargo-audit

        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo-audit
        run: cargo audit

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      - name: Fetch base branch for diff (Pull Request)
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Run Diff-based Mutation Testing (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          cargo mutants --in-diff pr.diff

      - name: Run Diff-based Mutation Testing (Push)
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          IF_NULL="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$IF_NULL" ] || [ -z "$BEFORE" ]; then
            git diff HEAD~1..HEAD > push.diff
          else
            git diff $BEFORE..HEAD > push.diff
          fi
          cargo mutants --in-diff push.diff




