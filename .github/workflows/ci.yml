name: CI

on:
  push:
    # `ci/**` branches run the checks without touching main (the release workflow runs on tags).
    branches: [ main, 'ci/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, Clippy, no_std, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: riscv32imac-unknown-none-elf, riscv32imc-unknown-none-elf, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: |
          cargo clippy --package bc_core --package bc_clone --package bc_c_api --package bc_zephyr --all-targets -- -D warnings
          cargo clippy --manifest-path examples/wasm_web_app/crate/Cargo.toml --all-targets -- -D warnings
          cargo clippy --package bc_qemu_riscv32 --target riscv32imac-unknown-none-elf -- -D warnings
          cargo clippy --package bc_qemu_riscv32 --target riscv32imc-unknown-none-elf -- -D warnings
          cargo clippy --package bc_c_api --target riscv32imac-unknown-none-elf --no-default-features -- -D warnings
          cargo clippy --package bc_c_api --target riscv32imc-unknown-none-elf --no-default-features -- -D warnings
          cargo clippy --package bc_zephyr --target riscv32imac-unknown-none-elf --no-default-features -- -D warnings
          cargo clippy --package bc_zephyr --target riscv32imc-unknown-none-elf --no-default-features -- -D warnings

      - name: Verify no_std Compilation on RISC-V 32 and Wasm32
        run: |
          cargo check --package bc_core --target riscv32imac-unknown-none-elf --no-default-features
          cargo check --package bc_core --target riscv32imc-unknown-none-elf --no-default-features
          cargo check --package bc_core --target wasm32-unknown-unknown --no-default-features
          cargo check --package bc_c_api --target riscv32imac-unknown-none-elf --no-default-features
          cargo check --package bc_c_api --target riscv32imc-unknown-none-elf --no-default-features
          cargo check --package bc_zephyr --target riscv32imac-unknown-none-elf --no-default-features
          cargo check --package bc_zephyr --target riscv32imc-unknown-none-elf --no-default-features

      - uses: taiki-e/install-action@cargo-audit

      - name: Run cargo-audit
        run: cargo audit

  test:
    name: Tests, coverage, GNU and POSIX suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/gnu-bc

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Tests with Coverage
        run: cargo llvm-cov --package bc_core --package bc_clone --package bc_c_api --package bc_zephyr --all-targets --fail-under-lines 98 --lcov --output-path lcov.info

      - name: Run Official GNU bc Reference Test Suite
        run: bash scripts/run_gnu_reference_tests.sh

      - name: Run POSIX IEEE Std 1003.1 Compliance Test Suite
        run: bash scripts/run_posix_compliance_tests.sh

  spec:
    name: Executable specification (differential tests, POSIX suite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: spec

      - name: Cache Verus
        uses: actions/cache@v4
        with:
          path: ~/.local/verus
          key: verus-${{ runner.os }}-${{ hashFiles('scripts/verus_env.sh') }}

      - uses: ./.github/actions/gnu-bc

      - name: Differential Tests and POSIX Suite against the Executable Specification
        run: |
          bash scripts/build_spec_oracle.sh --no-verify target/bc_spec_oracle
          BC_SPEC_ORACLE="$PWD/target/bc_spec_oracle" BC_SPEC_ORACLE_REQUIRED=1 \
            cargo test --package bc_clone --test spec_differential
          BC_BIN="$PWD/target/bc_spec_oracle" bash scripts/run_posix_compliance_tests.sh

  embedded:
    name: M5Stamp C3, Wasm, QEMU RISC-V 32
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32imac-unknown-none-elf, riscv32imc-unknown-none-elf, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: embedded

      - name: Verify M5Stamp C3 (ESP32-C3) Baremetal Application
        run: bash scripts/build_m5stamp_c3.sh

      - name: Verify WebAssembly (wasm32) Web Application
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 || true
          bash scripts/build_wasm.sh

      - name: Install QEMU RISC-V System Emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-misc

      - name: Run QEMU RISC-V 32 Baremetal Automated Test Suite
        run: bash scripts/run_qemu_riscv32_tests.sh

  verus:
    name: Verus (bc_core, bc_spec)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verus

      - name: Cache Verus
        uses: actions/cache@v4
        with:
          path: ~/.local/verus
          key: verus-${{ runner.os }}-${{ hashFiles('scripts/verus_env.sh') }}

      - name: Run Verus Formal Verification (bc_core, bc_spec)
        run: bash scripts/run_verus_verification.sh

  kani:
    name: Kani
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kani

      - name: Run Kani Bounded Model Checking Verification
        run: bash scripts/run_kani_verification.sh

  miri:
    name: Miri (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: bc_c_api, stage: c_api, args: '' }
          - { name: bc_c_api tree borrows, stage: c_api_tree, args: '' }
          - { name: bc_zephyr, stage: zephyr, args: '' }
          - { name: bc_clone, stage: cli, args: '' }
          # bc_core is split by test name, by the times measured under Miri: the wide-block test
          # alone takes about as long as the integer and math-library tests together. The last
          # shard skips what the others run, so a new test always runs somewhere.
          - { name: bc_core wide blocks, stage: core, args: 'eval::tests::test_blocks_wider_than_the_fast_path_budget --exact' }
          - { name: bc_core integers and mathlib, stage: core, args: 'bigint:: mathlib::' }
          - { name: bc_core rest, stage: core, args: '--skip eval::tests::test_blocks_wider_than_the_fast_path_budget --skip bigint:: --skip mathlib::' }
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri

      - name: Run Miri Undefined Behavior & Memory-Safety Verification
        run: bash scripts/run_miri_tests.sh ${{ matrix.stage }} -- ${{ matrix.args }}

  mutants:
    name: Diff-based mutation testing (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2 ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants

      - uses: ./.github/actions/gnu-bc

      - uses: taiki-e/install-action@cargo-mutants

      - name: Compute the diff to mutate
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff "origin/${BASE_REF}...HEAD" > mutants.diff
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
              git diff HEAD~1..HEAD > mutants.diff
            else
              git diff "${BEFORE}..HEAD" > mutants.diff
            fi
          else
            # ci/** branches and manual runs: everything not yet on main.
            git diff origin/main...HEAD > mutants.diff
          fi
          wc -l mutants.diff

      - name: Run Diff-based Mutation Testing
        run: |
          mkdir -p target/mutants-tmp
          # Exit status 3 means only timeouts: a mutant made a loop never end, which the tests
          # detected by hanging.
          TMPDIR="$PWD/target/mutants-tmp" cargo mutants --in-diff mutants.diff --gitignore true \
            --timeout 300 -j 2 --shard ${{ matrix.shard }}/3 || [ $? -eq 3 ]

      - name: Upload the mutants report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out

  zephyr:
    name: Zephyr RTOS (QEMU RISC-V 32 tests, M5Stamp C3 build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf, riscv32imc-unknown-none-elf

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-misc ninja-build

      - name: Cache Zephyr Workspace
        uses: actions/cache@v4
        with:
          path: ~/zephyrproject-bc
          key: zephyr-${{ hashFiles('scripts/setup_zephyr_workspace.sh') }}

      - name: Set Up Pinned Zephyr Workspace
        run: bash scripts/setup_zephyr_workspace.sh "${HOME}/zephyrproject-bc"

      - name: Run Zephyr Tests on QEMU RISC-V 32
        run: bash scripts/run_zephyr_tests.sh

      - name: Build and Smoke-Test the Zephyr Release Package
        run: |
          bash scripts/package_release.sh ci dist zephyr
          mkdir smoke && tar -C smoke -xzf dist/*-zephyr.tar.gz
          timeout 120 smoke/*/run-qemu-selftest.sh
