name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: bc_clone-linux-x86_64
            asset_name: bc_clone-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: bc_clone-macos-x86_64
            asset_name: bc_clone-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: bc_clone-macos-aarch64
            asset_name: bc_clone-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: bc_clone-windows-x86_64.exe
            asset_name: bc_clone-windows-x86_64.exe

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/bc_clone target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy target\${{ matrix.target }}\release\bc_clone.exe target\${{ matrix.target }}\release\${{ matrix.artifact_name }}

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
