name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: bc_clone-linux-x86_64
            asset_name: bc_clone-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: bc_clone-macos-x86_64
            asset_name: bc_clone-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: bc_clone-macos-aarch64
            asset_name: bc_clone-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: bc_clone-windows-x86_64.exe
            asset_name: bc_clone-windows-x86_64.exe

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/bc_clone target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy target\${{ matrix.target }}\release\bc_clone.exe target\${{ matrix.target }}\release\${{ matrix.artifact_name }}

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  examples:
    name: Package Wasm, M5Stamp C3 and QEMU RISC-V 32 builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, clippy
          targets: riscv32imac-unknown-none-elf, riscv32imc-unknown-none-elf, wasm32-unknown-unknown

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Packaging and Test Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-misc zip
          cargo install wasm-bindgen-cli --version 0.2.127

      - name: Build and Package
        run: bash scripts/package_release.sh "${{ github.ref_name }}" dist wasm m5stamp qemu

      - name: Smoke-Test the Packaged QEMU Binaries
        run: |
          mkdir smoke && tar -C smoke -xzf dist/*-qemu-riscv32-baremetal.tar.gz
          smoke/*/run.sh imac
          smoke/*/run.sh imc

      - name: Upload Packages to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zephyr:
    name: Package Zephyr RTOS builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf, riscv32imc-unknown-none-elf

      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-misc ninja-build

      - name: Set Up Pinned Zephyr Workspace
        run: bash scripts/setup_zephyr_workspace.sh "${HOME}/zephyrproject-bc"

      - name: Build and Package
        run: bash scripts/package_release.sh "${{ github.ref_name }}" dist zephyr

      - name: Smoke-Test the Packaged QEMU Self-Test
        run: |
          mkdir smoke && tar -C smoke -xzf dist/*-zephyr.tar.gz
          timeout 120 smoke/*/run-qemu-selftest.sh

      - name: Upload Packages to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
