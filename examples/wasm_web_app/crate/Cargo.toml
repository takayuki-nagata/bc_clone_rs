[package]
name = "bc_wasm"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "WebAssembly binding for bc_core arbitrary-precision math engine"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exposes BcSession::set_max_depth to measure the stack use of other limits.
stack-probe = []

[dependencies]
wasm-bindgen = "0.2"
bc_core = { path = "../../../crates/bc_core" }
bc_build_info = { path = "../../../crates/bc_build_info" }

[profile.release]
opt-level = "s"
lto = true
