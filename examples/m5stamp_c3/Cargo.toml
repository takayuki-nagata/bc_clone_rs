[package]
name = "m5stamp_c3_bc"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "M5Stamp C3 (ESP32-C3) Baremetal arbitrary-precision math runner with bc_core"

# The self-tests' report, the stack budget and the serial REPL, which the host's unit tests run
# under Miri.
[lib]
path = "src/lib.rs"

# The entry point and the hardware glue: built for the ESP32-C3 only.
[[bin]]
name = "m5stamp_c3_bc"
path = "./src/bin/main.rs"
test = false
bench = false

[dependencies]
bc_core = { path = "../../crates/bc_core" }
bc_build_info = { path = "../../crates/bc_build_info" }
# The self-tests and the nesting workloads, without the QEMU runner's own hardware crates.
bc_qemu_riscv32 = { path = "../../crates/bc_qemu_riscv32", default-features = false }

# Only the binary uses these; leaving them out of host builds lets the library's unit tests run
# on the host.
[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
esp-println = { version = "0.14.0", features = ["esp32c3", "auto"] }
# `internal-heap-stats`: the self-tests report the largest heap use.
esp-alloc = { version = "0.8.0", features = ["internal-heap-stats"] }
critical-section = "1.2.0"
embedded-io = "0.6.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri)'] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
