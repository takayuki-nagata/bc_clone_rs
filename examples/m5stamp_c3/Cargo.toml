[package]
name = "m5stamp_c3_bc"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "M5Stamp C3 (ESP32-C3) Baremetal arbitrary-precision math runner with bc_core"

[[bin]]
name = "m5stamp_c3_bc"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
esp-println = { version = "0.14.0", features = ["esp32c3", "auto"] }
esp-alloc = "0.8.0"
critical-section = "1.2.0"
bc_core = { path = "../../crates/bc_core" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
