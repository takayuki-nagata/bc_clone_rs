# Zephyr Kernel Console Configuration
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Memory & Stack Size Configuration for Arbitrary-Precision Math
# bc_zephyr::ZEPHYR_MAX_DEPTH (80 levels of nesting, up to ~800 bytes each) must fit this stack.
CONFIG_MAIN_STACK_SIZE=98304
