# Zephyr Kernel Console Configuration
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Memory & Stack Size Configuration for Arbitrary-Precision Math
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=2097152

# C standard library malloc arena configuration (2MB power of two)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=2097152
