[workspace]
resolver = "2"
members = [
    "crates/bc_core",
    "crates/bc_cli",
    "crates/bc_qemu_riscv32",
    "crates/bc_c_api",
    "crates/bc_zephyr",
    "crates/bc_spec",
    "crates/bc_build_info",
    "crates/bc_inventory",
]
default-members = [
    "crates/bc_core",
    "crates/bc_cli",
    "crates/bc_c_api",
    "crates/bc_zephyr",
    "crates/bc_build_info",
    "crates/bc_inventory",
]
exclude = [
    "examples/m5stamp_c3",
    "examples/wasm_web_app/crate",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
