[package]
name = "bc_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Arbitrary-precision decimal math engine, parser, and AST evaluator for bc clone (no_std + alloc)"

[dependencies]
num-bigint = { version = "0.5", default-features = false }
num-traits = { version = "0.2", default-features = false }
num-integer = { version = "0.1", default-features = false }
# `verus!` for the verified code; in normal builds it erases specifications and proofs. Both are
# `no_std` and need no atomics (unlike vstd, below).
verus_builtin = "=0.0.0-2026-10-11-0230"
verus_builtin_macros = "=0.0.0-2026-10-18-0147"
# Verification only (`verify`): the Verus standard library, whose version matches the Verus
# release pinned in `scripts/verus_env.sh`, and the executable specification for the refinement
# proofs. Neither is linked into production builds: vstd needs atomic compare-and-swap, which
# riscv32imc (ESP32-C3) lacks, and bc_spec needs `std`.
vstd = { version = "=0.0.0-2026-10-18-0147", default-features = false, features = ["alloc"], optional = true }
bc_spec = { path = "../bc_spec", optional = true }

[dev-dependencies]
proptest = "1.5"

[features]
default = []
c-api = []
# For `cargo verus verify -p bc_core --features verify`.
verify = ["dep:vstd", "dep:bc_spec"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(kani)', 'cfg(miri)'] }

[package.metadata.verus]
verify = true
