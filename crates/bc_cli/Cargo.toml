[package]
name = "bc_clone"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "POSIX-compliant bc calculator clone CLI"

[[bin]]
name = "bc_clone"
path = "src/main.rs"

[dependencies]
bc_core = { path = "../bc_core" }
ctrlc = "3.4"

[dev-dependencies]
proptest = "1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(miri)'] }
