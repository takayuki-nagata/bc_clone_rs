[package]
name = "bc_clone"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "POSIX-compliant bc calculator clone CLI"

[[bin]]
name = "bc_clone"
path = "src/main.rs"

[dependencies]
bc_core = { path = "../bc_core" }
bc_build_info = { path = "../bc_build_info" }
ctrlc = "3.4"

[dev-dependencies]
bc_spec = { path = "../bc_spec" }
proptest = "1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(miri)'] }
